name: Keep Streamlit Alive

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Keep-alive empty commit
        run: |
          date -u > last_active.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_active.txt
          git commit -m "Chore: Keepalive Streamlit Cloud [skip ci]"
          git push